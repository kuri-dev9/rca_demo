services:
  mysql:
    image: mysql:8.4
    container_name: rca_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Mobigen_1234}
      MYSQL_DATABASE: chat_demo
      MYSQL_CHARSET: utf8mb4
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "18002:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-Mobigen_1234}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: rca_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+aiomysql://root:${MYSQL_ROOT_PASSWORD:-Mobigen_1234}@mysql:3306/chat_demo
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    volumes:
      - knowledge_data:/app/knowledge_data
      - ./docs/data:/app/docs/data:ro
    ports:
      - "18001:8000"
    depends_on:
      mysql:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build:
      context: ./frontend
    container_name: rca_frontend
    restart: unless-stopped
    ports:
      - "18000:18000"
    depends_on:
      - backend

volumes:
  mysql_data:
  knowledge_data:
